<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sensor Data Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Live Sensor Data Viewer</h1>
            <div class="controls">
                <label>
                    Poll Interval (ms):
                    <input type="number" id="pollInterval" value="1000" min="100" step="100">
                </label>
                <button id="refreshBtn">Refresh Now</button>
                <label class="pause-label">
                    <input type="checkbox" id="pauseCheckbox">
                    Pause
                </label>
                <label>
                    History
                    <input type="number" id="historyWindow" value="60" min="0" step="1">
                    seconds
                </label>
            </div>
        </header>

        <div class="main-content">
            <aside class="side-panel">
                <h2>Sensors</h2>
                <div id="sensorList" class="sensor-list">
                    <p class="loading">Loading sensors...</p>
                </div>
            </aside>

            <main class="canvas-container">
                <canvas id="dataCanvas"></canvas>
                <div id="tooltip" class="tooltip"></div>
            </main>
        </div>
    </div>

    <!-- Login Dialog -->
    <div id="loginDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog">
            <h2>Authentication Required</h2>
            <p>Please enter your credentials to access the domain.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Login</button>
                    <button type="button" id="cancelLogin" class="btn-secondary">Cancel</button>
                </div>
                <div id="loginError" class="login-error" style="display: none;"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
